name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: |
          npm install
          npm install @capacitor/android@7.4.3

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          cp index.html app.js manifest.webmanifest icon.svg sw.js www/
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8')); c.webDir='www'; fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));"

      - name: Criar e sincronizar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Checklist-Fotografico-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
